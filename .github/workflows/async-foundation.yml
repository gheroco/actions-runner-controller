name: Async lifecycle admission
on:
  push:
    branches: [feature/async-lease-broker]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./experimental/async-lease-broker/lifecycle
      - run: go test -race ./controllers/actions.github.com -run TestAsyncBroker -count=1
