# Experimental API contract; no ARC reconciler is registered for this group yet.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: runnerexecutions.async.gheroco.dev
spec:
  group: async.gheroco.dev
  scope: Namespaced
  names:
    plural: runnerexecutions
    singular: runnerexecution
    kind: RunnerExecution
    shortNames:
    - rexec
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - leaseRef
            - segment
            - mode
            - expectedBrokerEpoch
            - expectedWorkspaceGeneration
            properties:
              leaseRef:
                type: string
                minLength: 1
              segment:
                type: integer
                minimum: 0
              mode:
                type: string
                enum:
                - Initial
                - Resume
                - Finalize
              expectedBrokerEpoch:
                type: integer
                format: int64
                minimum: 1
              continuationRef:
                type: string
              workerProfile:
                type: string
              expectedWorkspaceGeneration:
                type: integer
                format: int64
                minimum: 1
            x-kubernetes-validations:
            - rule: self.mode == 'Initial' || (has(self.continuationRef) && size(self.continuationRef)
                > 0)
              message: Resume and Finalize require continuationRef
            - rule: self == oldSelf
              message: Execution spec is immutable; create a new execution for a new
                segment
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - Pending
                - Starting
                - Running
                - SuspendPrepared
                - Suspended
                - Completed
                - Failed
                - Cancelled
              podRef:
                type: string
              podUid:
                type: string
              startedAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time
              disposition:
                type: string
                enum:
                - Completed
                - Suspended
                - Cancelled
                - Abandoned
                - InfrastructureFailure
              completionId:
                type: string
              message:
                type: string
        required:
        - spec
